name: Windows server build

on:
  push:
    branches: [main]
    paths:
      - sources.lock.json
      - scripts/**
      - .github/workflows/windows-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      BOOST_ROOT: C:\local\boost_1_87_0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned core and modules
        run: python scripts/prepare-sources.py
      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\local\boost_1_87_0
            C:\tools\mysql\current
          key: wow-win2022-boost187-mysql849-v1
      - name: Install build dependencies
        shell: pwsh
        run: ./scripts/install-dependencies.ps1
      - name: Configure Release x64
        shell: pwsh
        run: |
          cmake -S core -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE/out" `
            "-DMYSQL_INCLUDE_DIR=C:/tools/mysql/current/include" `
            "-DMYSQL_LIBRARY=C:/tools/mysql/current/lib/mysqlclient.lib" `
            "-DOPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR" `
            -DAPPS_BUILD=all -DTOOLS_BUILD=all -DSCRIPTS=static -DMODULES=static `
            -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
      - name: Compile server and extraction tools
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
          cmake --install build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed' }
      - name: Package binaries, SQL and source snapshot
        shell: pwsh
        run: python scripts/package.py
      - name: Check executable versions
        shell: pwsh
        run: |
          Push-Location dist/Server
          ./authserver.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'authserver version check failed' }
          ./worldserver.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'worldserver version check failed' }
          Pop-Location
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: WoW-Local-Server-Windows-x64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload configure diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
